# Render Blueprint — MV THE CROWN backend (temporary demo deploy).
# DB is external (Supabase), so no database block here.
# Secrets are set in the Render dashboard, NOT committed (sync: false).
services:
  - type: web
    name: mvcrowncruise-backend
    runtime: python
    plan: free
    # Repo root is this backend/ folder (set Root Directory = backend on Render
    # if the repo root differs). Build installs deps; release/start via Procfile.
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DRF_NUM_PROXIES
        value: "1"
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      # Dashboard-managed like the credentials it belongs with, NOT pinned
      # here. A literal "True" in the blueprint is re-applied on every sync,
      # so a live site would be quietly put back on the sandbox gateway —
      # checkout still works, and no money arrives.
      - key: SSLCOMMERZ_IS_SANDBOX
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
